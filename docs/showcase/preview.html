<h1 id="sinalacs">SinalACS</h1>
<p class="tagline">Priorização clínica de visitas domiciliares na Atenção Primária à Saúde</p>
<p><span class="kicker">Showcase do protótipo</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="statement" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" class="statement" data-marpit-pagination="2" style="--paginate:true;--class:statement;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<h1 id="a-doen%C3%A7a-n%C3%A3o-segue-o-mapa">A doença não segue o mapa.</h1>
<p>O Agente Comunitário de Saúde visita as casas na ordem do roteiro geográfico rua por rua, sempre igual. <br />
 Quem está pior pode ser a última visita do dia,<br />
simplesmente por morar no fim da rua.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="statement" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" class="statement" data-marpit-pagination="3" style="--paginate:true;--class:statement;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<h1 id="sinais-cl%C3%ADnicos-estruturados-%E2%86%92-fila-ranqueada-por-risco">Sinais clínicos estruturados → fila ranqueada por risco</h1>
<p>Uma triagem de três perguntas, com regra determinística inspirada no<br />
  Protocolo de Manchester, sem inteligência artificial, sem campo editável.<br />
  A mesma resposta produz sempre a mesma cor, de forma auditável.</p>
<div class="card-grid cols-3" style="margin-top: 32px;">
  <div class="card">
    <h3>e-SUS APS</h3>
    <p>Registra o que já aconteceu.</p>
  </div>
  <div class="card">
    <h3>WhatsApp</h3>
    <p>Desorganiza comunicação sem estrutura nem prioridade.</p>
  </div>
  <div class="card" style="border-color: var(--acs-fill);">
    <h3 style="color: var(--acs-text);">SinalACS</h3>
    <p>Prioriza, com regra fechada e reproduzível.</p>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="4" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<h1 id="arquitetura-em-um-slide">Arquitetura em um slide</h1>
<div class="card-grid cols-4" style="margin-top: 24px;">
  <div class="card">
    <h3>3 apps Flutter</h3>
    <p>Paciente, ACS e Admin: isomorfismo Dart de ponta a ponta com o backend.</p>
  </div>
  <div class="card">
    <h3>Backend Dart/Serverpod</h3>
    <p>RPC tipado, ORM e migrações geradas não é REST.</p>
  </div>
  <div class="card">
    <h3>PostgreSQL + MQTT/TLS</h3>
    <p>Persistência relacional e entrega de alerta com confirmação (ACK).</p>
  </div>
  <div class="card">
    <h3>Traefik</h3>
    <p>Reverse proxy/edge gateway para tráfego RPC e WebSockets do MQTT.</p>
  </div>
</div>
<p style="margin-top: 24px; color: var(--text-muted); font-size: 16px;">
Offline-first: cache territorial em <code>sqflite</code> no app do ACS, com
sincronização em segundo plano assim que a rede volta.
</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="5" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">

  <div class="frame-col">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="10" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">

    <div class="phone-frame">
      <img src="images/acs-territorializacao.png" alt="Territorialização" />

  </div>
  <div class="info-col">

      <li>Microárea, quantidade de pacientes e status do cache local</li>
      <li><strong>O ACS só acessa dados do próprio território</strong>

      <li>Cache territorial via <code>sqflite</code>, para operar sem rede</li>
    </ul>
  </div>

<p><span class="app-tag acs">ACS</span></p>
</section>

<div class="split">

  </div>
</div>
<p><span class="app-tag acs">ACS</span></p>
</section>

    <div class="phone-frame">
      <img src="images/acs-visita.png" alt="Registro de visita offline" />

  </div>

      <li>Enfileiramento local; sincronização automática ao voltar a rede</li>
      <li>Em zona rural, é a diferença entre ter o dado e perder o dia</li>
    </ul>
  </div>
</div>
<p><span class="app-tag acs">ACS</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="13" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<div class="split">
  <div class="frame-col">
    <div class="phone-frame">
      <img src="images/acs-acionamento.png" alt="Tela de acionamento e escalonamento" />
    </div>
  </div>
  <div class="info-col">
    <h2>ACS: Acionamento e escalonamento</h2>
    <ul>
      <li>Resume: paciente, risco e endereço para acionar SAMU ou UBS</li>
      <li>Botões deixam explícito que discagem e encaminhamento reais ainda não
        estão integrados</li>
      <li>Integração SAMU <span class="badge-roadmap">roadmap</span></li>
    </ul>
  </div>
</div>
<p><span class="app-tag acs">ACS</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="14" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<div class="split">
  <div class="frame-col" style="flex-basis: 48%;">
    <div class="phone-pair">
      <div class="phone-frame" style="width: 240px;">
        <img src="images/admin-indicadores.png" alt="Painel de indicadores" />
      </div>
      <div class="phone-frame" style="width: 240px;">
        <img src="images/admin-microarea.png" alt="Microáreas e vínculo ACS" />
      </div>
    </div>
  </div>
  <div class="info-col">
    <h2>Admin: Indicadores e microáreas</h2>
    <ul>
      <li>Contadores por risco, alertas abertos vs. reconhecidos e o TMRAV</li>
      <li>Listagem somente leitura das microáreas e do ACS vinculado</li>
      <li>Desktop-first: <code>NavigationRail</code> em telas largas,
        <code>NavigationBar</code> abaixo de 640px</li>
    </ul>
  </div>
</div>
<p><span class="app-tag admin">Admin</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="15" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<div class="split">
  <div class="frame-col" style="flex-basis: 48%;">
    <div class="phone-pair">
      <div class="phone-frame" style="width: 240px;">
        <img src="images/admin-alertas.png" alt="Alertas da UBS" />
      </div>
      <div class="phone-frame" style="width: 240px;">
        <img src="images/admin-auditoria.png" alt="Logs de auditoria" />
      </div>
    </div>
  </div>
  <div class="info-col">
    <h2>Admin: Alertas, auditoria e layout responsivo</h2>
    <ul>
      <li>Alertas filtráveis por microárea e status sem controle de
        reclassificação (a classificação não é alterável por humano, INV-02)</li>
      <li>Log de auditoria somente leitura; toda visita às telas sensíveis
        também é registrada</li>
      <li>Mesmo <code>ThemeData</code> se adapta de celular a tablet</li>
    </ul>
  </div>
</div>
<p><span class="app-tag admin">Admin</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="16" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<h1 id="seguran%C3%A7a-e-lgpd">Segurança e LGPD</h1>
<div class="card-grid cols-3" style="margin-top: 24px;">
  <div class="card">
    <h3>Dados sensíveis</h3>
    <p>Colunas clínicas criptografadas (AES-256/pgcrypto) em repouso e TLS em trânsito.</p>
  </div>
  <div class="card">
    <h3>Restrição por microárea</h3>
    <p>INV-01 reforçada no backend, não só na interface um ACS nunca lê dados
      fora do próprio território.</p>
  </div>
  <div class="card">
    <h3>Trilha de auditoria</h3>
    <p>Acesso a dado sensível registrado com quem, quando e o quê inclusive
      no backoffice Admin.</p>
  </div>
</div>
<p style="margin-top: 24px; color: var(--text-muted); font-size: 15px;">
Conformidade LGPD documentada em <code>spec/lgpd_design.md</code>; análise de
cibersegurança baseada em NIST CSF 2.0 em <code>spec/security_assessment.md</code>.
</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" data-marpit-pagination="17" style="--paginate:true;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<h1 id="estado-atual-e-roadmap">Estado atual e roadmap</h1>
<p>Protótipo validado localmente, ciclo de alerta vermelho roda ponta a ponta
com confirmação de entrega, CI verde nos quatro trilhos.</p>
<div class="roadmap">
  <div class="phase done">
    <div class="status">Concluída</div>
    <strong>Fase 1 Prova de conceito</strong>
  </div>
  <div class="phase done">
    <div class="status">Concluída</div>
    <strong>Fase 2 Alpha/Beta</strong>
  </div>
  <div class="phase pending">
    <div class="status">Em curso</div>
    <strong>Fase 3 Disponibilidade geral</strong>
    <p style="font-size: 14px; margin-top: 8px;">Deploy monitorado, teste de
      carga e auditoria de conformidade LGPD</p>
  </div>
</div>
<p style="margin-top: 20px; font-size: 16px;">
Mapa interativo, geofencing, integração SAMU e avisos push
<span class="badge-roadmap">roadmap v1.5</span> hoje são stubs no protótipo,
não capacidades ativas.
</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="closing" data-lang="pt-BR" data-theme="5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr" lang="pt-BR" class="closing" data-marpit-pagination="18" style="--paginate:true;--class:closing;--lang:pt-BR;--theme:5z7dk2yt73e1v56lwxqz01evz0ph3u7xtxjd06wjsjr;" data-marpit-pagination-total="18">
<h1 id="o-pedido-um-piloto-controlado">O pedido: um piloto controlado</h1>
<div class="bignums">
  <div><div class="num">1</div><div class="label">UBS</div></div>
  <div><div class="num">2</div><div class="label">microáreas</div></div>
  <div><div class="num">50</div><div class="label">pacientes</div></div>
</div>
<p>
Para medir a única métrica que importa: quanto tempo leva, hoje, até alguém
chegar em quem está pior.
<span class="badge-target">alvo &lt; 90s (TMRAV)</span>
</p>
<p style="margin-top: 40px; color: var(--text-muted);">
SinalACS · github.com/hbgit/SinalACS · contato: completar antes da apresentação
</p>
</section>
