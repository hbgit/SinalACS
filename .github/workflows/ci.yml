name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  serverpod-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Banco que o harness de teste do Serverpod espera, conforme
      # sinalacs_server/config/test.yaml. O harness aplica as migrações sozinho
      # e reverte o banco a cada caso, então não há passo de schema nem de seed —
      # é o que substitui os quatro psql enumerados à mão do job backend.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ZGib82sxRnAaTto3iglbPkARA1qZUv0W
          POSTGRES_DB: sinalacs_test
        ports:
          - 9090:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sinalacs_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart analyze
      # Suíte dividida em duas etapas (em vez de um único `dart test`) para
      # isolar onde o job trava. test/unit passa limpo; test/integration
      # falha de forma consistente só no runner real do GitHub Actions,
      # nunca localmente em nenhuma reprodução com o mesmo SDK/Postgres/
      # estrutura de workflow. Investigação até aqui (ver histórico do git
      # para o rastro completo de cada tentativa):
      #   - Descartado por medição direta no próprio job: exaustão de CPU/
      #     memória (nproc=4, 14Gi livres), limite de memória de cgroup (nem
      #     existe — é VM, não container), OOM killer (nada no dmesg), crash
      #     nativo com sinal capturável (nenhum core file mesmo com
      #     ulimit -c unlimited), imagem do runner (ubuntu-22.04 reproduz
      #     igual), SDK do Dart (3.8.0 e 3.12.2 reproduzem igual),
      #     concorrência do dart test, tamanho de stack, e as env vars
      #     GITHUB_ACTIONS/CI que a ferramenta detecta (dart test --help
      #     documenta um reporter "github" condicional a isso).
      #   - Confirmado via strace -f (artifact baixado numa rodada de
      #     diagnóstico): quem morre é uma thread interna do próprio
      #     dart test ("DartWorker", mesmo PID/processo da suíte) chamando
      #     exit_group(1) ela mesma — sem sinal do SO, sem mensagem em
      #     stdout/stderr — momentos depois de ficar ~3.5s bloqueada num
      #     futex e então gerar código JIT ("dart-code"). Ou seja, é o
      #     próprio dart test/VM do Dart decidindo sair, silenciosamente,
      #     só nesse ambiente.
      # Bateria de diagnóstico temporária. Remover assim que a causa for
      # encontrada — não deve ficar em CI permanente.
      - name: Diagnóstico do crash de integração
        continue-on-error: true
        run: |
          set +e
          echo "########## 0) espaço em disco ##########"
          df -h / /tmp

          echo "########## 1) dart --verbose run (para o VM dizer o que houve) ##########"
          timeout 300 dart --verbose run test/integration/red_alert_cycle_test.dart 2>&1 | tail -80
          echo "EXIT_1=${PIPESTATUS[0]}"

          echo "########## 2) bisseção por import ##########"
          mkdir -p /tmp/bisect
          printf "import 'package:sinalacs_server/src/generated/protocol.dart';\nvoid main() => print('protocol OK: \${Protocol()}');\n" > /tmp/bisect/a_protocol.dart
          printf "import 'package:serverpod/serverpod.dart';\nvoid main() => print('serverpod OK');\n" > /tmp/bisect/b_serverpod.dart
          printf "import 'package:serverpod_test/serverpod_test.dart';\nvoid main() => print('serverpod_test OK');\n" > /tmp/bisect/c_serverpod_test.dart
          printf "import 'package:sinalacs_server/src/generated/endpoints.dart';\nvoid main() => print('endpoints OK');\n" > /tmp/bisect/d_endpoints.dart
          printf "void main() => print('baseline OK');\n" > /tmp/bisect/e_baseline.dart
          for f in e_baseline a_protocol b_serverpod c_serverpod_test d_endpoints; do
            cp "/tmp/bisect/$f.dart" "test/integration/zz_$f.dart"
            OUT=$(timeout 180 dart run "test/integration/zz_$f.dart" 2>&1)
            echo "[$f] exit=$? output=${OUT:-<VAZIO>}"
            rm -f "test/integration/zz_$f.dart"
          done

          echo "########## 3) o próprio test_tools gerado ##########"
          printf "import 'test_tools/serverpod_test_tools.dart';\nvoid main() => print('test_tools OK');\n" > test/integration/zz_tools.dart
          OUT=$(timeout 180 dart run test/integration/zz_tools.dart 2>&1)
          echo "[test_tools] exit=$? output=${OUT:-<VAZIO>}"
          rm -f test/integration/zz_tools.dart
        working-directory: backend/sinalacs_server
      - run: dart test test/unit -r expanded
        working-directory: backend/sinalacs_server
      - run: dart test test/integration -r expanded --chain-stack-traces
        working-directory: backend/sinalacs_server

  backend-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Imagem do servidor Serverpod, a mesma que o docker-compose constrói.
      # O contexto é a raiz do workspace, porque o build precisa do pubspec.lock
      # compartilhado entre sinalacs_server e sinalacs_client.
      - name: Build Serverpod Docker image
        run: docker build -f backend/sinalacs_server/Dockerfile backend

  patient-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  acs-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/acs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
