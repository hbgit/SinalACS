name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  serverpod-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Senha do Postgres efêmero deste job. NÃO é um segredo: o banco existe só
      # dentro do runner, some ao fim do job e nunca é alcançável de fora.
      #
      # O que importa é que este valor não seja compartilhado com mais nada.
      # Antes era a MESMA senha do config/passwords.yaml local — que o
      # .gitignore protege e que é idêntica nos blocos development, test,
      # staging e production. O segredo protegido pelo .gitignore estava, na
      # prática, publicado aqui.
      #
      # Declarado uma vez e referenciado nos dois lugares: o serviço abaixo e a
      # geração do passwords.yaml. Eram dois literais mantidos iguais à mão, e
      # divergir fazia a suíte morrer sem log nenhum.
      CI_POSTGRES_PASSWORD: ci-ephemeral-not-a-secret

    services:
      # Banco que o harness de teste do Serverpod espera, conforme
      # sinalacs_server/config/test.yaml. O harness aplica as migrações sozinho
      # e reverte o banco a cada caso, então não há passo de schema nem de seed —
      # é o que substitui os quatro psql enumerados à mão do job backend.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: sinalacs_test
        ports:
          - 9090:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sinalacs_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart analyze
      # config/passwords.yaml é gitignored (guarda segredos de dev), então não
      # existe num checkout limpo — inclusive o do runner. Sem ele o harness do
      # Serverpod não carrega a senha do banco, falha ainda no carregamento de
      # config e chama exit(1); como o exit() do Dart não dá flush no stdout, a
      # mensagem de erro se perde e a falha fica totalmente silenciosa (exit 1,
      # zero linhas de log).
      #
      # Localmente, quem gera este arquivo é scripts/dev/bootstrap_env.sh.
      - name: Cria config/passwords.yaml para o harness de teste
        run: |
          printf "test:\n  database: '%s'\n" "$CI_POSTGRES_PASSWORD" \
            > sinalacs_server/config/passwords.yaml
      # Suíte completa: 16 testes herméticos em test/unit, que usam fakes das
      # interfaces AlertPublisher e AlertStore, mais 9 de integração que sobem o
      # servidor em processo pelo harness e exercitam os endpoints tipados.
      - run: dart test
        working-directory: backend/sinalacs_server

  backend-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Imagem do servidor Serverpod, a mesma que o docker-compose constrói.
      # O contexto é a raiz do workspace, porque o build precisa do pubspec.lock
      # compartilhado entre sinalacs_server e sinalacs_client.
      - name: Build Serverpod Docker image
        run: docker build -f backend/sinalacs_server/Dockerfile backend

  patient-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  acs-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/acs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
