name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  serverpod-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Banco que o harness de teste do Serverpod espera, conforme
      # sinalacs_server/config/test.yaml. O harness aplica as migrações sozinho
      # e reverte o banco a cada caso, então não há passo de schema nem de seed —
      # é o que substitui os quatro psql enumerados à mão do job backend.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ZGib82sxRnAaTto3iglbPkARA1qZUv0W
          POSTGRES_DB: sinalacs_test
        ports:
          - 9090:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sinalacs_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart analyze
      # Suíte dividida em duas etapas (em vez de um único `dart test`) para
      # isolar onde o job trava: `dart test` completo estava morrendo em ~7s
      # sem nenhuma saída (exit 1, sem "loading ...", sem stack trace) só no
      # runner real do GitHub — nproc (4) e free -h (15Gi, 14Gi disponível)
      # descartaram exaustão de CPU/memória como causa, e o SDK do Dart
      # (3.8.0 e 3.12.2) não fez diferença. O log com --concurrency=1 mostrou
      # que a suíte tentou carregar test/integration/red_alert_cycle_test.dart
      # (o único arquivo pesado, que sobe o Serverpod completo via
      # serverpod_test) antes de morrer. Rodar as duas suítes em passos
      # separados isola definitivamente se o problema é essa carga pesada.
      - run: dart test test/unit -r expanded
        working-directory: backend/sinalacs_server
      # test/integration trava sem nenhuma saída sempre durante o "loading"
      # (compilação) de red_alert_cycle_test.dart, nunca chegando a executar
      # um teste — só no runner do GitHub Actions, nunca localmente (Dart
      # 3.8.0/3.12.2 + Postgres 15-alpine, mesma estrutura do workflow, 30/30
      # testes passando sempre). Já descartei SDK do Dart, memória (14Gi
      # livres), CPU (4 cores), concorrência, stack size e a imagem do runner
      # (ubuntu-22.04 vs ubuntu-latest) como causa — todos reproduzem a mesma
      # assinatura exata. Precisa de investigação com acesso ao runner
      # (ex.: debug via tmate) para ir além disso.
      - run: dart test test/integration -r expanded --chain-stack-traces
        working-directory: backend/sinalacs_server

  backend-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Imagem do servidor Serverpod, a mesma que o docker-compose constrói.
      # O contexto é a raiz do workspace, porque o build precisa do pubspec.lock
      # compartilhado entre sinalacs_server e sinalacs_client.
      - name: Build Serverpod Docker image
        run: docker build -f backend/sinalacs_server/Dockerfile backend

  patient-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  acs-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/acs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
