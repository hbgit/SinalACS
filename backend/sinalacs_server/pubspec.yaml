name: sinalacs_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  serverpod: 3.4.13
  crypto: ^3.0.3
  cryptography: ^2.7.0
  meta: ^1.15.0
  mqtt_client: ^10.0.0
  # Dependência DIRETA por causa de bin/seed_health_data.dart: o seed cifrado
  # roda fora do processo do Serverpod e abre a própria conexão. Já vinha
  # resolvido como transitiva do serverpod, então não move o pubspec.lock.
  postgres: ^3.5.12
  uuid: ^4.5.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.13
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\sinalacs_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\sinalacs_server\web\app
      posix: |
        cd ../sinalacs_flutter
        flutter build web --base-href /app/ --wasm --output ../sinalacs_server/web/app
