# This is the configuration file for your local development environment. By
# default, it runs a single server on port 8080. To set up your server, you will
# need to add the name of the database you are connecting to and the user name.
# The password for the database is stored in the config/passwords.yaml.
#
# When running your server locally, the server ports are the same as the public
# facing ports — exceto o `apiServer`: ver o comentário do bloco abaixo.

# Configuration for the main API server.
apiServer:
  # O processo continua escutando 8080 em texto claro DENTRO do container —
  # quem termina TLS é o Traefik, que é o único que publica porta. Estes campos
  # apontam para a URL cifrada, que é o endereço público real do RPC, e não para
  # a porta interna.
  #
  # Ressalva MEDIDA, para o próximo leitor não tomar isto por mais do que é: quem
  # serve estes campos é o `AppConfigRoute` de `lib/server.dart`, e a rota dele
  # vive no webServer (8082) — que este compose não publica nem roteia —, não no
  # apiServer que o Traefik atende: `https://localhost/app/assets/assets/config.json`
  # devolve 404 do Serverpod. E nenhum dos apps lê esse arquivo; eles constroem o
  # cliente com o host do `--dart-define`. Isto é o endereço declarado, não o
  # endereço em uso.
  port: 8080
  publicHost: localhost
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

# This is the database setup for your server.
database:
  host: localhost
  port: 8090
  name: sinalacs
  user: postgres
  #requireSsl: true # defaults to false
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# This is the setup for Redis.
redis:
  enabled: false
  host: localhost
  port: 8091
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000
