### Unidade Básica de Saúde.
class: Ubs
table: ubs
fields:
  id: UuidValue?, defaultPersist=random
  name: String
  address: String
  city: String
  state: String
  ### Telefone de contato da UBS para o ACS escalar um caso (RF13). Dado da
  ### unidade, não de pessoa. `null` = ainda não cadastrado: o app avisa, não liga.
  contactPhone: String?
