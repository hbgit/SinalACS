### Registro de cada exportação da trilha de auditoria (#45). Append-only:
### guarda quem exportou, os filtros, o intervalo de `sequence` coberto e o
### SHA-256 do conteúdo, para que a própria exportação seja auditável.
class: AuditExport
table: audit_exports
fields:
  id: UuidValue?, defaultPersist=random
  requestedBy: UuidValue, relation(parent=users)
  requestedAt: DateTime
  ### Só os parâmetros do filtro (`AdminAuditFilter.toJson`, chaves
  ### `from`/`to` e as opcionais), nunca linhas exportadas. LGPD: guarda o
  ### `search` e o `actorEnrollmentId` digitados pelo administrador — texto
  ### livre de até 64 caracteres que casa só com matrícula do autor,
  ### `resourceType` e `result` (nunca nome, CPF, UUID ou hash), mas que o
  ### operador pode preencher com qualquer coisa: tratar como dado pessoal
  ### do staff (identificação profissional) e não ecoar em log.
  filtersJson: String
  format: String
  rowCount: int
  firstSequence: int?
  lastSequence: int?
  contentSha256: String
  ### Resultado da verificação da cadeia no momento da exportação.
  chainState: String
indexes:
  audit_exports_requested_at_idx:
    fields: requestedAt
