### Agente Comunitário de Saúde.
###
### Mesma decisão de chave aplicada em Patient: o id desta tabela é o UUID do
### usuário, fornecido na inserção.
class: Acs
table: acs
fields:
  id: UuidValue?, defaultPersist=random
  enrollmentId: String
  ubsId: UuidValue
  active: bool
  lastSyncAt: DateTime?
indexes:
  acs_ubs_idx:
    fields: ubsId
  ### O login institucional procura o ACS por `enrollmentId`. Sem unicidade, a
  ### matrícula deixaria de identificar uma pessoa: duas linhas com 'ACS-001' e
  ### o login passaria a escolher a primeira que o Postgres devolvesse.
  acs_enrollment_id_key:
    fields: enrollmentId
    unique: true
