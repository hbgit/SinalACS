### Convite de uso único gerado pelo ACS para um paciente já cadastrado em
### sua microárea concluir o onboarding no próprio aparelho. Não cria
### identidade nova (RF01/RF07 — autenticação institucional — segue sem
### decisão própria); ativa o acesso de um paciente que já existe em
### `patients`, na microárea de quem gerou o convite.
class: EnrollmentToken
table: enrollment_tokens
fields:
  id: UuidValue?, defaultPersist=random
  ### sha256 do token real. O valor em claro só existe no momento da geração
  ### (devolvido ao ACS para virar QR Code) e nunca é persistido — a mesma
  ### disciplina de `users.cpfHash` (só o hash vai ao banco), mas **não** o
  ### mesmo mecanismo: aqui é SHA-256 sem pepper e sem domínio, e ali é HMAC
  ### com `CPF_HASH_PEPPER`. Não há equivalência a sugerir — o parecer do
  ### §2.1 de `spec/lgpd_data_audit.md` não se aplica a nenhum dos dois, e
  ### por motivos diferentes: o token tem 32 bytes de `Random.secure()` (nada
  ### a enumerar), o CPF tem 10^9 possibilidades (era enumerável, e passou a
  ### ter segredo de servidor na chave).
  tokenHash: String
  patientId: UuidValue, relation(parent=patients)
  microAreaId: UuidValue
  createdByAcsId: UuidValue, relation(parent=acs)
  createdAt: DateTime
  expiresAt: DateTime
  ### Marca o consumo atômico. `null` = ainda válido para uso.
  consumedAt: DateTime?
indexes:
  enrollment_tokens_token_hash_key:
    fields: tokenHash
    unique: true
