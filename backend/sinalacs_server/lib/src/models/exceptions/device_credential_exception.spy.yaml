### Recusa do login por credencial de dispositivo do participante (C-05).
###
### Uma exceção só, com mensagem única, para segredo errado, deviceId
### desconhecido, credencial revogada (C-12) e formato inválido: a resposta
### não pode dizer ao atacante qual dos casos aconteceu. Falta de microárea é
### outra exceção ([DeviceCredentialTerritoryException]): ali a credencial é
### válida, e o app não pode descartá-la.
exception: DeviceCredentialException
fields:
  message: String
