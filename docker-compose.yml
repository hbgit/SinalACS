version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sinalacs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinalacs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-sinalacs_db}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sinalacs_user} -d ${POSTGRES_DB:-sinalacs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco do harness de teste do Serverpod. Fica atrás de um profile porque não
  # faz parte da stack da aplicação:
  #
  #     docker compose --profile test up -d postgres-test
  #     cd backend/sinalacs_server && dart test
  #
  # Porta, nome e usuário seguem backend/sinalacs_server/config/test.yaml, e a
  # senha é a mesma que scripts/dev/bootstrap_env.sh grava em
  # config/passwords.yaml — se divergirem, o Serverpod falha ao carregar a
  # config e chama exit(1), que não dá flush no stdout: a suíte morre com exit 1
  # e nenhuma linha de log.
  #
  # Substitui backend/sinalacs_server/docker-compose.yaml, o template do
  # Serverpod que carregava quatro senhas em texto claro no git.
  postgres-test:
    image: postgres:15-alpine
    container_name: sinalacs-postgres-test
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      POSTGRES_DB: sinalacs_test
    ports:
      - "9090:5432"
    # Sem volume: o banco de teste é descartável, e o harness aplica as
    # migrações e reverte a cada caso.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sinalacs_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sinalacs-mosquitto
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "8883:8883"
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/docker/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./infra/docker/mosquitto/runtime/passwordfile:/mosquitto/config/passwordfile:ro
      - ./infra/docker/mosquitto/runtime/certs:/mosquitto/certs:ro
      - ./infra/docker/mosquitto/runtime/data:/mosquitto/data

  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: sinalacs-mosquitto-init
    user: root
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      MQTT_ACS_PASSWORD: ${MQTT_ACS_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      # SANs adicionais no certificado do broker, para validar em aparelho
      # físico na LAN: MQTT_CERT_SAN_EXTRA='IP:192.168.0.10' docker compose up
      MQTT_CERT_SAN_EXTRA: ${MQTT_CERT_SAN_EXTRA:-}
    volumes:
      - ./infra/docker/mosquitto/init.sh:/init.sh:ro
      - ./infra/docker/mosquitto/runtime:/mosquitto/runtime
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && sh /init.sh"]

  serverpod:
    build:
      context: ./backend
      dockerfile: sinalacs_server/Dockerfile
    container_name: sinalacs-serverpod
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # O Serverpod aplica as próprias migrações no boot, o que substitui o
      # serviço one-shot database-init: o guard anterior era tudo-ou-nada sobre
      # a existência de public.users e pulava em silêncio um banco parcialmente
      # migrado.
      SERVERPOD_APPLY_MIGRATIONS: "true"
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: ${POSTGRES_DB:-sinalacs_db}
      SERVERPOD_DATABASE_USER: ${POSTGRES_USER:-sinalacs_user}
      SERVERPOD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      SERVERPOD_REDIS_ENABLED: "false"
      # O Insights escuta 8081 por padrão, que aqui é o dashboard do Traefik.
      SERVERPOD_INSIGHTS_SERVER_PORT: "8083"
      MQTT_BROKER: mosquitto:8883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      MQTT_USE_TLS: "true"
      MQTT_CA_CERT_PATH: /app/certs/ca.crt
      # Sem esta variável o servidor caía num segredo de desenvolvimento fixo e
      # público, com o qual qualquer pessoa forjaria um token de ACS.
      JWT_SECRET: ${JWT_SECRET:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEV_LOGIN: "${ENABLE_DEV_LOGIN:-true}"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/docker/mosquitto/runtime/certs:/app/certs:ro

  # Dados sintéticos de desenvolvimento. Roda depois que o servidor sobe, porque
  # é ele quem aplica as migrações. O seed não é opcional: o dev-login referencia
  # UUIDs fixos e alerts.patientId tem FK para patients.
  database-seed:
    image: postgres:15-alpine
    depends_on:
      serverpod:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
    volumes:
      - ./backend/sinalacs_server/lib/src/infrastructure/database/seeds:/seeds:ro
    entrypoint:
      - /bin/sh
      - -c
      - psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER:-sinalacs_user} -d ${POSTGRES_DB:-sinalacs_db} -f /seeds/development.sql

  traefik:
    image: traefik:v2.10
    container_name: sinalacs-traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pg_data:
