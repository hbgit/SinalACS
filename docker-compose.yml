version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sinalacs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinalacs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-sinalacs_db}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sinalacs_user} -d ${POSTGRES_DB:-sinalacs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco do harness de teste do Serverpod. Fica atrás de um profile porque não
  # faz parte da stack da aplicação:
  #
  #     docker compose --profile test up -d postgres-test
  #     cd backend/sinalacs_server && dart test
  #
  # Porta, nome e usuário seguem backend/sinalacs_server/config/test.yaml, e a
  # senha é a mesma que scripts/dev/bootstrap_env.sh grava em
  # config/passwords.yaml — se divergirem, o Serverpod falha ao carregar a
  # config e chama exit(1), que não dá flush no stdout: a suíte morre com exit 1
  # e nenhuma linha de log.
  #
  # Substitui backend/sinalacs_server/docker-compose.yaml, o template do
  # Serverpod que carregava quatro senhas em texto claro no git.
  postgres-test:
    image: postgres:15-alpine
    container_name: sinalacs-postgres-test
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      POSTGRES_DB: sinalacs_test
    ports:
      - "9090:5432"
    # Sem volume: o banco de teste é descartável, e o harness aplica as
    # migrações e reverte a cada caso.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sinalacs_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sinalacs-mosquitto
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "8883:8883"
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/docker/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./infra/docker/mosquitto/runtime/passwordfile:/mosquitto/config/passwordfile:ro
      - ./infra/docker/mosquitto/runtime/certs:/mosquitto/certs:ro
      - ./infra/docker/mosquitto/runtime/data:/mosquitto/data

  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: sinalacs-mosquitto-init
    user: root
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      MQTT_ACS_PASSWORD: ${MQTT_ACS_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      # SANs adicionais no certificado do broker, para validar em aparelho
      # físico na LAN: MQTT_CERT_SAN_EXTRA='IP:192.168.0.10' docker compose up
      MQTT_CERT_SAN_EXTRA: ${MQTT_CERT_SAN_EXTRA:-}
    volumes:
      - ./infra/docker/mosquitto/init.sh:/init.sh:ro
      - ./infra/docker/mosquitto/runtime:/mosquitto/runtime
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && sh /init.sh"]

  serverpod:
    build:
      context: ./backend
      dockerfile: sinalacs_server/Dockerfile
    # Nome fixo para que o health-data-seed reaproveite ESTA imagem em vez de
    # declarar o mesmo `build:` e reconstruí-la.
    image: sinalacs/server:local
    container_name: sinalacs-serverpod
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # O Serverpod aplica as próprias migrações no boot, o que substitui o
      # serviço one-shot database-init: o guard anterior era tudo-ou-nada sobre
      # a existência de public.users e pulava em silêncio um banco parcialmente
      # migrado.
      SERVERPOD_APPLY_MIGRATIONS: "true"
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: ${POSTGRES_DB:-sinalacs_db}
      SERVERPOD_DATABASE_USER: ${POSTGRES_USER:-sinalacs_user}
      SERVERPOD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      SERVERPOD_REDIS_ENABLED: "false"
      # O Insights escuta 8081 por padrão, que aqui é o dashboard do Traefik.
      SERVERPOD_INSIGHTS_SERVER_PORT: "8083"
      MQTT_BROKER: mosquitto:8883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      MQTT_USE_TLS: "true"
      MQTT_CA_CERT_PATH: /app/certs/ca.crt
      # Sem esta variável o servidor caía num segredo de desenvolvimento fixo e
      # público, com o qual qualquer pessoa forjaria um token de ACS.
      JWT_SECRET: ${JWT_SECRET:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      # Chave da cadeia de hash de audit_logs — segredo próprio, nunca derivado
      # do JWT_SECRET (rotacionar um não pode invalidar o outro em silêncio).
      AUDIT_CHAIN_SECRET: ${AUDIT_CHAIN_SECRET:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      # Chave AES-256-GCM das colunas clínicas (RNF03/INV-04). Opcional em
      # development — AppConfig cai num hex público conhecido —, obrigatória
      # fora dele. PRECISA ser a mesma do health-data-seed abaixo, ou o
      # diretório de pacientes não decifra o que o seed gravou.
      HEALTH_DATA_ENCRYPTION_KEY: ${HEALTH_DATA_ENCRYPTION_KEY:-}
      # Pepper do HMAC de `users.cpfHash` (RF01). PRECISA ser o mesmo valor que o
      # `cpf-hash-seed` recebe, pela mesma razão do
      # HEALTH_DATA_ENCRYPTION_KEY acima: o seed deriva o hash e o servidor o
      # procura — com peppers diferentes, nenhum CPF semeado é encontrado.
      #
      # `:-` e não `:?`, como o HEALTH_DATA_ENCRYPTION_KEY: o Compose interpola
      # o arquivo INTEIRO, então um `:?` derrubaria toda invocação de
      # `docker compose` numa máquina cujo `.env` é anterior à variável. O
      # guarda não se perde: fora de development o `AppConfig` recusa subir.
      CPF_HASH_PEPPER: ${CPF_HASH_PEPPER:-}
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEV_LOGIN: "${ENABLE_DEV_LOGIN:-true}"
    # O RPC só é alcançável por HTTPS em :443. A publicação de 8080 foi
    # REMOVIDA de propósito: enquanto ela existisse, o TLS seria decorativo —
    # RNF04 pede TLS em todas as comunicações, e um caminho em texto claro ao
    # lado do cifrado é o caminho que alguém usa.
    #
    # O `Host(...)` precisa casar com o que o cliente envia: o emulador manda
    # `Host: 10.0.2.2`, as ferramentas na máquina mandam `Host: localhost`. Um
    # host fora da regra devolve 404 do Traefik, e a mensagem não diz que o
    # problema é o `Host` — para validar por outro endereço (IP da LAN, por
    # exemplo), acrescente-o aqui.
    labels:
      - traefik.enable=true
      - traefik.http.routers.sinalacs.rule=Host(`10.0.2.2`) || Host(`localhost`) || Host(`sinalacs.localhost`)
      - traefik.http.routers.sinalacs.entrypoints=websecure
      - traefik.http.routers.sinalacs.tls=true
      # A porta INTERNA do container, que continua sendo 8080 — o que mudou foi
      # não haver mais publicação no host. O processo segue escutando em texto
      # claro aqui dentro; quem termina TLS é o Traefik.
      - traefik.http.services.sinalacs.loadbalancer.server.port=8080
    volumes:
      - ./infra/docker/mosquitto/runtime/certs:/app/certs:ro

  # Dados sintéticos de desenvolvimento. Roda depois que o servidor sobe, porque
  # é ele quem aplica as migrações. O seed não é opcional: o dev-login referencia
  # UUIDs fixos e alerts.patientId tem FK para patients.
  database-seed:
    image: postgres:15-alpine
    depends_on:
      serverpod:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
    volumes:
      - ./backend/sinalacs_server/lib/src/infrastructure/database/seeds:/seeds:ro
    entrypoint:
      - /bin/sh
      - -c
      - psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER:-sinalacs_user} -d ${POSTGRES_DB:-sinalacs_db} -f /seeds/development.sql

  # Segunda metade do seed: as colunas clínicas CIFRADAS, que o SQL acima não
  # consegue montar (AES-256-GCM não é expressão de Postgres aqui — a decisão
  # §6 é cifrar na aplicação, para o texto claro nunca passar pelo log de query
  # do Serverpod). Reaproveita a imagem do servidor, então usa a MESMA
  # HealthDataCipher e a MESMA chave do processo que vai ler esses dados.
  health-data-seed:
    image: sinalacs/server:local
    depends_on:
      database-seed:
        condition: service_completed_successfully
    environment:
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: ${POSTGRES_DB:-sinalacs_db}
      SERVERPOD_DATABASE_USER: ${POSTGRES_USER:-sinalacs_user}
      SERVERPOD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      HEALTH_DATA_ENCRYPTION_KEY: ${HEALTH_DATA_ENCRYPTION_KEY:-}
      APP_ENV: ${APP_ENV:-development}
    entrypoint: ["./seed_health_data"]

  # Terceira metade do seed: a credencial institucional (RF07), que também só
  # existe em Dart (Argon2id não é expressão de Postgres). Roda depois do
  # database-seed, que é quem cria o usuário ACS referenciado.
  acs-credential-seed:
    image: sinalacs/server:local
    depends_on:
      database-seed:
        condition: service_completed_successfully
    environment:
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: ${POSTGRES_DB:-sinalacs_db}
      SERVERPOD_DATABASE_USER: ${POSTGRES_USER:-sinalacs_user}
      SERVERPOD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      # Senha do ACS de desenvolvimento. Gerada por máquina — o script recusa
      # rodar fora de APP_ENV=development.
      DEV_ACS_PASSWORD: ${DEV_ACS_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      APP_ENV: ${APP_ENV:-development}
    entrypoint: ["./seed_acs_credentials"]

  # Quarta metade do seed: os hashes de CPF do login passwordless (RF01), que
  # dependem do pepper e por isso só existem em Dart. Sem ele `users.cpfHash`
  # fica com os literais que o SQL gravou ('development-patient'), que nenhum
  # HMAC produz — e o login do paciente não encontra ninguém.
  cpf-hash-seed:
    image: sinalacs/server:local
    depends_on:
      database-seed:
        condition: service_completed_successfully
    environment:
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: ${POSTGRES_DB:-sinalacs_db}
      SERVERPOD_DATABASE_USER: ${POSTGRES_USER:-sinalacs_user}
      SERVERPOD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — rode ./scripts/dev/bootstrap_env.sh}
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      # O MESMO pepper do serviço `serverpod` (ver a linha comentada lá): o seed
      # deriva o hash e o servidor o procura, então peppers diferentes fazem o
      # login deixar de achar qualquer paciente semeado.
      #
      # `:-` e não `:?` de propósito — ver o comentário no serviço `serverpod`.
      CPF_HASH_PEPPER: ${CPF_HASH_PEPPER:-}
      APP_ENV: ${APP_ENV:-development}
    entrypoint: ["./seed_cpf_hashes"]

  # Gera a CA de desenvolvimento do RPC e o certificado do servidor. One-shot,
  # como o mosquitto-init: roda antes do Traefik, que monta o resultado.
  traefik-init:
    image: alpine:3.19
    container_name: sinalacs-traefik-init
    environment:
      # SANs adicionais para validar em aparelho físico na LAN:
      #   RPC_CERT_SAN_EXTRA='IP:192.168.0.10' docker compose up
      #
      # ATENÇÃO, medido: com a stack JÁ DE PÉ, mudar só esta variável regera a
      # folha (o `traefik-init` é recriado) mas **não** recria o `traefik`, que
      # continua servindo a folha antiga — o fingerprint só muda depois de
      # `docker compose restart traefik`. O Compose não recria o dependente
      # quando só o `environment` do one-shot muda. Subir do zero funciona,
      # porque o `depends_on` garante a ordem. Sem o restart, o teste em
      # aparelho físico falha na validação de hostname e a mensagem não diz por quê.
      RPC_CERT_SAN_EXTRA: ${RPC_CERT_SAN_EXTRA:-}
    volumes:
      # O script escreve em `$runtime_dir/certs/` (mesma forma do runtime do
      # Mosquitto), então a raiz aqui é `runtime/` e os arquivos caem em
      # `runtime/certs/` — que é o que o `traefik` monta abaixo. Montar
      # `runtime/certs` aqui faria o gerador escrever em `runtime/certs/certs/`
      # e o Traefik não acharia certificado nenhum (medido).
      - ./infra/docker/traefik/init.sh:/init.sh:ro
      - ./infra/docker/traefik/runtime:/certs
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && sh /init.sh"]

  traefik:
    # v2.11, e NÃO v2.10: o provider Docker do v2.10 fala a API 1.24 por padrão,
    # e o Docker 29 deste host tem mínimo 1.40 — medido, `traefik:v2.10` (2.10.7)
    # enche o log de "client version 1.24 is too old", não enxerga label nenhuma e
    # o :443 responde 404 do Traefik (nenhum router existe). `DOCKER_API_VERSION`
    # não resolve — o cliente do v2.10 não lê a variável (medido) —, e o v3.5
    # falha igual (medido). O v2.11 (2.11.57) conecta e lista o router `sinalacs`.
    # A config dinâmica é a mesma: o `dynamic/tls.yaml` da Task 1 carrega sem
    # aviso neste v2.11.
    image: traefik:v2.11
    container_name: sinalacs-traefik
    depends_on:
      traefik-init:
        condition: service_completed_successfully
    command:
      - --api.insecure=true
      - --providers.docker=true
      # O backend é roteado por label explícita (abaixo), não por exposição
      # automática: `exposedByDefault=false` impede que um serviço novo
      # publicado por engano ganhe uma rota pública sozinho.
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      # Só o 443 chega ao RPC. O :80 continua declarado mas sem router nenhum
      # apontando para o backend — ver a remoção de 8080 no serviço abaixo.
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/docker/traefik/dynamic:/etc/traefik/dynamic:ro
      # O Traefik é quem termina o TLS, então é ele quem lê os certificados. O
      # subdiretório `certs/` é o que o gerador acima produz — ver o comentário
      # do mount dele antes de mudar qualquer um dos dois.
      - ./infra/docker/traefik/runtime/certs:/certs:ro

volumes:
  pg_data:
