<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinalACS - Autenticação e Onboarding Inclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medical: { 500: '#0d9488', 600: '#0f766e' },
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .pulse-ring { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="flex justify-center min-h-screen">
    <div class="w-full max-w-md bg-dark-900 relative shadow-2xl flex flex-col h-screen md:h-[90vh] md:my-auto md:rounded-[2rem] border-x md:border border-dark-700 overflow-hidden">
        
        <!-- Header -->
        <header class="p-6 pb-4 flex justify-between items-center z-10 border-b border-dark-800/80">
            <div>
                <span class="text-[10px] font-bold text-medical-500 uppercase tracking-widest">Módulo de Acesso Fricção Zero</span>
                <h1 class="text-xl font-bold text-white tracking-tight mt-0.5">Autenticação e Onboarding Inclusivo</h1>
            </div>
            <div class="w-10 h-10 rounded-full bg-dark-800 border border-dark-700 flex items-center justify-center text-medical-500 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-6 z-10">
            
            <div class="glass p-6 rounded-2xl mb-5 text-center">
                <div class="w-16 h-16 bg-medical-500/20 text-medical-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-medical-500/30">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                </div>
                <h3 class="font-bold text-white text-lg mb-1">Acesso Passwordless</h3>
                <p class="text-xs text-slate-400 mb-6">Entre instantaneamente com seu CPF e Data de Nascimento, ou escaneie o QR Code fornecido pelo ACS.</p>
                
                <div class="space-y-4 text-left">
                    <div>
                        <label class="text-xs font-semibold text-slate-300 block mb-1">CPF do Paciente</label>
                        <input type="text" placeholder="000.000.000-00" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-medical-500 transition-colors">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-300 block mb-1">Data de Nascimento</label>
                        <input type="date" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-sm text-slate-300 focus:outline-none focus:border-medical-500 transition-colors">
                    </div>
                    <button class="w-full bg-medical-600 hover:bg-medical-500 text-white font-semibold py-3 rounded-xl transition-transform active:scale-[0.98] shadow-md mt-2">
                        Entrar sem Senha (SMS OTP)
                    </button>
                    <button class="w-full bg-dark-700 hover:bg-dark-600 text-slate-200 font-semibold py-3 rounded-xl border border-dark-600 transition-transform active:scale-[0.98] flex items-center justify-center gap-2">
                        <svg class="w-5 h-5 text-medical-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                        Escanear QR Code do ACS
                    </button>
                </div>
            </div>
        
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 w-full glass border-t border-dark-700 px-6 py-4 flex justify-between items-center z-20 md:rounded-b-[2rem]">
            <a href="paciente_1_autenticacao.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-medical-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                <span class="text-[9px] font-medium">Acesso</span>
            </a>
            <a href="paciente_2_alerta_urgencia.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-red-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span class="text-[9px] font-medium">Urgência</span>
            </a>
            <a href="paciente_3_triagem.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-medical-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span class="text-[9px] font-medium">Triagem</span>
            </a>
            <a href="paciente_4_duvidas.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-medical-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                <span class="text-[9px] font-medium">Dúvidas</span>
            </a>
            <a href="paciente_5_perfil_clinico.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-medical-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[9px] font-medium">Perfil</span>
            </a>
            <a href="paciente_6_status_solicitacao.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-medical-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[9px] font-medium">Status</span>
            </a>
            <a href="paciente_7_lembretes.html" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-medical-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[9px] font-medium">Alarmes</span>
            </a>
        </nav>
    </div>
</body>
</html>
