# Configuração dinâmica do Traefik (provider `file`).
#
# Só aponta para caminhos: os certificados em si são gerados pelo
# `traefik-init` em runtime/certs, que não é versionado.
tls:
  certificates:
    - certFile: /certs/server.crt
      keyFile: /certs/server.key
  stores:
    default:
      # Sem isto, uma requisição cujo SNI não case com nenhum certificado
      # recebe o certificado default do Traefik (auto-assinado por ele), e o
      # app falharia com erro de confiança em vez de chegar ao servidor.
      defaultCertificate:
        certFile: /certs/server.crt
        keyFile: /certs/server.key
  options:
    default:
      # RNF04 pede TLS 1.3 nominalmente. Declarar o mínimo torna o requisito
      # verificável (`openssl s_client -tls1_2` precisa FALHAR), em vez de
      # "tem alguma criptografia".
      minVersion: VersionTLS13

http:
  serversTransports:
    # Traefik → backend (RNF04, issues #78 e #90): TLS MÚTUO. O Traefik verifica
    # a folha do backend contra a CA do RPC (runtime/backend/, gerada pelo
    # traefik-init) — disca pelo IP do container, então o nome verificado é
    # fixado aqui e tem de estar no SAN daquela folha — e APRESENTA o seu
    # próprio certificado de cliente (`certificates`), que o backend exige no
    # handshake; sem ele a 8080 recusa antes de qualquer byte HTTP e o Traefik
    # devolve 5xx para todos os apps. Sem `insecureSkipVerify` em lugar nenhum:
    # o Grupo E do tls_invariants.sh cobra, e cobra também este `certificates`.
    # O mínimo 1.3 deste trecho é imposto pelo próprio backend
    # (ApiTlsConfig.toSecurityContext).
    backend-tls:
      serverName: sinalacs-serverpod
      rootCAs:
        - /certs/ca.crt
      # #90: a folha de CLIENTE do Traefik, emitida pelo traefik-init com a CA
      # do RPC (EKU clientAuth, CN sinalacs-traefik; chave 600, só o Traefik,
      # que roda como root, a lê).
      certificates:
        - certFile: /certs/traefik-client.crt
          keyFile: /certs/traefik-client.key
