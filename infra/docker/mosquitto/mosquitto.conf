persistence true
persistence_location /mosquitto/data/
log_dest stdout
listener 8883 0.0.0.0
# Os clientes verificam o BROKER pela CA do servidor (runtime/certs/ca.crt, que
# continua indo para os apps); esta `cafile` é a do outro lado: a CA que o broker
# aceita como emissora de certificado de CLIENTE. Desde a #94 é a CA de
# aparelhos (runtime/devices/, gerada pelo mosquitto-init e operada pelo
# backend), que emite um certificado por aparelho do ACS, o do backend e o das
# ferramentas de QA. Uma folha da CA do servidor (o antigo acs-area-12
# compartilhado) é recusada no handshake.
cafile /mosquitto/devices/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# RNF04: mínimo TLS 1.3 neste listener (sem isto o Mosquitto 2 aceita 1.2);
# provado pelo Grupo F de scripts/qa/tls_invariants.sh.
tls_version tlsv1.3
# Revogação por aparelho. O Mosquitto 2.1.2 só lê este arquivo no load e no
# SIGHUP (medido, scripts/qa/spikes/mosquitto_crl_spike.sh); quem manda o SIGHUP
# é o sidecar mosquitto-crl-reload (crl_reload.sh), e só depois de validar a CRL
# contra a CA — uma CRL vazia ou inválida + SIGHUP TERMINA o broker (medido).
crlfile /mosquitto/devices/crl.pem
# mTLS sem senha: a identidade é o certificado. O username passa a ser o CN (o
# `-u`/senha do CONNECT são ignorados): `backend` para o servidor, o UUID da
# microárea para cada aparelho do ACS — é o %u dos `pattern` do aclfile.
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/aclfile
